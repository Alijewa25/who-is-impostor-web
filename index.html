<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPOSTOR — Party Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: #0f0c1b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(15, 12, 27, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: #ff0055; }
        main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; flex-grow: 1; }
        .hero-title { font-size: 36px; font-weight: 900; margin-bottom: 15px; }
        .hero-title span { color: #ff0055; }
        .game-card { background: #181528; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 30px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); text-align: left; }
        .game-card h2 { font-size: 20px; margin-bottom: 15px; text-align: center; }
        label { display: block; color: #8a8aa3; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-top: 15px; margin-bottom: 6px; }
        input, select { width: 100%; padding: 14px; background: #0f0c1b; border: 1px solid #2a2640; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #ff0055; }
        .btn-action { width: 100%; padding: 15px; background: #ff0055; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-action:hover { background: #e0004c; }
        .btn-secondary { background: #2a2640; }
        .hidden { display: none !important; }
        .room-info-box { background: #0f0c1b; border: 1px solid #2a2640; border-radius: 12px; padding: 15px; text-align: center; margin: 15px 0; }
        .room-title-display { font-size: 20px; font-weight: 800; color: #fff; }
        .pin-code-display { font-size: 24px; font-weight: 900; letter-spacing: 4px; color: #ff0055; margin-top: 5px; }
        .player-list { list-style: none; margin: 15px 0; max-height: 180px; overflow-y: auto; }
        .player-item { background: #0f0c1b; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; border: 1px solid #2a2640; font-size: 14px; }
        .countdown { font-size: 80px; font-weight: 900; color: #ff0055; text-align: center; }
        .card-container { perspective: 1000px; margin: 20px 0; height: 140px; }
        .flipper { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flipper.flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; text-align: center; padding: 10px; }
        .front { background: #221d38; color: #8a8aa3; border: 2px dashed #3d3560; }
        .back { background: #0077ff; color: #fff; transform: rotateY(180deg); }
        .back.impostor { background: #ff0055; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <div class="logo">PLAY<span>IMPOSTOR</span></div>
    </header>

    <main>
        <h1 class="hero-title">ONLINE <span>IMPOSTOR</span></h1>

        <div class="game-card">

            <!-- MAIN MENU -->
            <div id="entry-screen">
                <h2>NO REGISTRATION NEEDED</h2>
                <button class="btn-action" onclick="showScreen('create-screen')">Create Room</button>
                <button class="btn-action btn-secondary" onclick="showScreen('join-screen')">Join Room</button>
            </div>

            <!-- CREATE ROOM -->
            <div id="create-screen" class="hidden">
                <h2>CREATE ROOM</h2>
                
                <label>Room Name</label>
                <input type="text" id="create-room-name" placeholder="e.g. MafiaClub">

                <label>Room PIN</label>
                <input type="number" id="create-room-pin" placeholder="e.g. 1234">

                <label>Your Nickname</label>
                <input type="text" id="host-nickname" placeholder="e.g. Alex">

                <label>Word Set</label>
                <select id="category">
                    <option value="food">Food & Drinks</option>
                    <option value="cities">Global Cities</option>
                    <option value="objects">Everyday Objects</option>
                    <option value="movies">Movies & Shows</option>
                </select>

                <button class="btn-action" onclick="createRoom()">Create Room</button>
                <button class="btn-action btn-secondary" onclick="showScreen('entry-screen')">Back</button>
            </div>

            <!-- JOIN ROOM -->
            <div id="join-screen" class="hidden">
                <h2>JOIN ROOM</h2>

                <label>Room Name</label>
                <input type="text" id="join-room-name" placeholder="e.g. MafiaClub">

                <label>Room PIN</label>
                <input type="number" id="join-room-pin" placeholder="e.g. 1234">

                <label>Your Nickname</label>
                <input type="text" id="join-nickname" placeholder="e.g. Sarah">

                <button class="btn-action" onclick="joinRoom()">Join Room</button>
                <button class="btn-action btn-secondary" onclick="showScreen('entry-screen')">Back</button>
            </div>

            <!-- LOBBY -->
            <div id="lobby-screen" class="hidden">
                <div class="room-info-box">
                    <div class="room-title-display" id="display-room-name">ROOM</div>
                    <div class="pin-code-display">PIN: <span id="display-room-pin">----</span></div>
                </div>

                <label>Connected Players (<span id="player-count">0</span>)</label>
                <ul class="player-list" id="player-list"></ul>

                <button id="start-btn" class="btn-action hidden" onclick="startCountdown()">Start Game</button>
                <p id="waiting-msg" style="text-align:center; color:#8a8aa3; font-size:13px; margin-top:10px;">Waiting for host to start...</p>
            </div>

            <!-- COUNTDOWN -->
            <div id="countdown-screen" class="hidden">
                <h2>GET READY!</h2>
                <div class="countdown" id="countdown-timer">3</div>
            </div>

            <!-- GAMEPLAY -->
            <div id="game-screen" class="hidden">
                <h2 id="role-player-name">Player</h2>
                
                <div class="card-container">
                    <div id="flipper" class="flipper">
                        <div class="front">Tap to Reveal</div>
                        <div id="role-back" class="back">...</div>
                    </div>
                </div>

                <button id="reveal-btn" class="btn-action" onclick="flipCard()">Show My Word</button>
                <button id="host-reset-btn" class="btn-action btn-secondary hidden" onclick="resetRoom()">Next Round</button>
            </div>

        </div>
    </main>

<script>
    const firebaseConfig = {
        databaseURL: "https://impostor-game-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const wordList = {
        food: ["Burger", "Pizza", "Sushi", "Tacos", "Pasta", "Ramen", "Ice Cream"],
        cities: ["New York", "London", "Tokyo", "Paris", "Rome", "Dubai", "Istanbul"],
        objects: ["Smartphone", "Backpack", "Headphones", "Wristwatch", "Sunglasses"],
        movies: ["Inception", "Titanic", "Avatar", "The Matrix", "Gladiator"]
    };

    let roomKey = null;
    let roomName = null;
    let roomPin = null;
    let myName = null;
    let isHost = false;

    // Auto-Rejoin
    window.onload = () => {
        const savedRoom = localStorage.getItem('impostor_room');
        const savedPin = localStorage.getItem('impostor_pin');
        const savedName = localStorage.getItem('impostor_name');

        if (savedRoom && savedPin && savedName) {
            roomName = savedRoom;
            roomPin = savedPin;
            myName = savedName;
            roomKey = `${roomName}_${roomPin}`.toLowerCase().replace(/\s+/g, '');
            rejoinSession();
        }
    };

    function showScreen(screenId) {
        document.querySelectorAll('.game-card > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function createRoom() {
        roomName = document.getElementById('create-room-name').value.trim();
        roomPin = document.getElementById('create-room-pin').value.trim();
        myName = document.getElementById('host-nickname').value.trim();
        const category = document.getElementById('category').value;

        if (!roomName || !roomPin || !myName) return alert('Fill in all fields!');

        roomKey = `${roomName}_${roomPin}`.toLowerCase().replace(/\s+/g, '');
        isHost = true;

        localStorage.setItem('impostor_room', roomName);
        localStorage.setItem('impostor_pin', roomPin);
        localStorage.setItem('impostor_name', myName);

        db.ref('rooms/' + roomKey).set({
            roomName: roomName,
            pin: roomPin,
            host: myName,
            category: category,
            state: 'lobby',
            players: { [myName]: { joined: true } }
        });

        listenToRoom();
    }

    function joinRoom() {
        roomName = document.getElementById('join-room-name').value.trim();
        roomPin = document.getElementById('join-room-pin').value.trim();
        myName = document.getElementById('join-nickname').value.trim();

        if (!roomName || !roomPin || !myName) return alert('Fill in all fields!');

        roomKey = `${roomName}_${roomPin}`.toLowerCase().replace(/\s+/g, '');

        db.ref('rooms/' + roomKey).once('value', snapshot => {
            if (!snapshot.exists()) return alert('Room not found! Check Room Name and PIN.');

            isHost = false;
            localStorage.setItem('impostor_room', roomName);
            localStorage.setItem('impostor_pin', roomPin);
            localStorage.setItem('impostor_name', myName);

            db.ref(`rooms/${roomKey}/players/${myName}`).set({ joined: true });
            listenToRoom();
        });
    }

    function rejoinSession() {
        db.ref('rooms/' + roomKey).once('value', snapshot => {
            if (snapshot.exists()) {
                const room = snapshot.val();
                if (room.host === myName) isHost = true;
                listenToRoom();
            } else {
                localStorage.clear();
                showScreen('entry-screen');
            }
        });
    }

    function listenToRoom() {
        db.ref('rooms/' + roomKey).on('value', snapshot => {
            const room = snapshot.val();
            if (!room) {
                localStorage.clear();
                location.reload();
                return;
            }

            if (room.state === 'lobby') {
                showScreen('lobby-screen');
                updateLobby(room);
            } else if (room.state === 'countdown') {
                showScreen('countdown-screen');
                runCountdownUI();
            } else if (room.state === 'ingame') {
                showScreen('game-screen');
                setupGameUI(room);
            }
        });
    }

    function updateLobby(room) {
        document.getElementById('display-room-name').innerText = room.roomName;
        document.getElementById('display-room-pin').innerText = room.pin;

        const playerList = document.getElementById('player-list');
        playerList.innerHTML = '';

        const players = Object.keys(room.players || {});
        document.getElementById('player-count').innerText = players.length;

        players.forEach(p => {
            const li = document.createElement('li');
            li.className = 'player-item';
            li.innerHTML = `<span>${p}</span> ${p === room.host ? '<strong style="color:#ff0055;">HOST</strong>' : ''}`;
            playerList.appendChild(li);
        });

        if (isHost) {
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('waiting-msg').classList.add('hidden');
        } else {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('waiting-msg').classList.remove('hidden');
        }
    }

    function startCountdown() {
        if (!isHost) return;
        db.ref('rooms/' + roomKey).once('value', snapshot => {
            const room = snapshot.val();
            const players = Object.keys(room.players);
            const categoryWords = wordList[room.category];
            const secretWord = categoryWords[Math.floor(Math.random() * categoryWords.length)];
            const impostorName = players[Math.floor(Math.random() * players.length)];

            db.ref(`rooms/${roomKey}`).update({
                secretWord: secretWord,
                impostor: impostorName,
                state: 'countdown'
            });
        });
    }

    function runCountdownUI() {
        let count = 3;
        const timerElem = document.getElementById('countdown-timer');
        timerElem.innerText = count;

        const interval = setInterval(() => {
            count--;
            if (count > 0) {
                timerElem.innerText = count;
            } else {
                clearInterval(interval);
                if (isHost) {
                    db.ref(`rooms/${roomKey}`).update({ state: 'ingame' });
                }
            }
        }, 1000);
    }

    function setupGameUI(room) {
        document.getElementById('role-player-name').innerText = myName;
        document.getElementById('flipper').classList.remove('flipped');

        const roleBack = document.getElementById('role-back');
        roleBack.classList.remove('impostor');

        if (room.impostor === myName) {
            roleBack.innerText = "YOU ARE THE IMPOSTOR!";
            roleBack.classList.add('impostor');
        } else {
            roleBack.innerText = `WORD: ${room.secretWord}`;
        }

        if (isHost) {
            document.getElementById('host-reset-btn').classList.remove('hidden');
        }
    }

    function flipCard() {
        document.getElementById('flipper').classList.toggle('flipped');
    }

    function resetRoom() {
        if (!isHost) return;
        db.ref(`rooms/${roomKey}`).update({ state: 'lobby' });
    }
</script>

</body>
</html>
