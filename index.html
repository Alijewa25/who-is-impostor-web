<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>IMPOSTOR — Word Party Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0f0c1b;
    --card:#181528;
    --card-alt:#1f1b33;
    --accent:#ff0055;
    --accent-dim:#ff005522;
    --secondary:#0077ff;
    --secondary-dim:#0077ff22;
    --text:#ffffff;
    --text-dim:#8a8aa3;
    --border:#2a2540;
    --radius:16px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,0,85,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(0,119,255,0.08), transparent 40%);
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }

  .screen{
    width:100%;
    max-width:460px;
    display:none;
    animation:fadeIn 0.35s ease;
  }
  .screen.active{ display:block; }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .brand{
    text-align:center;
    margin-bottom:36px;
  }
  .brand h1{
    font-size:38px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .brand h1 span{ color:var(--accent); }
  .brand p{
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:6px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }

  h2.title{
    font-size:22px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:24px;
    text-align:center;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .field input, .field select{
    width:100%;
    background:var(--card-alt);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
    font-weight:500;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  .field input::placeholder{ color:#5a5570; }
  .field input:focus, .field select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
  }
  .field select{
    appearance:none;
    -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position:calc(100% - 20px) center, calc(100% - 15px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    cursor:pointer;
  }

  .btn{
    width:100%;
    display:block;
    text-align:center;
    padding:15px 20px;
    border-radius:10px;
    border:none;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.5px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 24px rgba(255,0,85,0.35);
  }
  .btn-primary:hover:not(:disabled){ box-shadow:0 10px 30px rgba(255,0,85,0.5); }

  .btn-secondary{
    background:var(--secondary);
    color:#fff;
    box-shadow:0 8px 24px rgba(0,119,255,0.35);
  }
  .btn-secondary:hover:not(:disabled){ box-shadow:0 10px 30px rgba(0,119,255,0.5); }

  .btn-ghost{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{ border-color:var(--text-dim); color:var(--text); }

  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row-gap{ margin-top:20px; }

  .link-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    padding:8px;
    width:100%;
    text-align:center;
  }
  .link-btn:hover{ color:var(--text); }

  .error-msg{
    background:var(--accent-dim);
    border:1px solid var(--accent);
    color:#ff8fb3;
    font-size:13px;
    font-weight:600;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:16px;
    display:none;
    text-align:center;
  }
  .error-msg.show{ display:block; }

  /* Lobby */
  .lobby-header{
    text-align:center;
    margin-bottom:24px;
  }
  .lobby-header .room-name{
    font-size:24px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .lobby-header .room-pin{
    display:inline-block;
    margin-top:10px;
    background:var(--card-alt);
    border:1px solid var(--border);
    padding:8px 18px;
    border-radius:8px;
    font-size:20px;
    font-weight:800;
    letter-spacing:4px;
    color:var(--accent);
  }
  .lobby-header .category-tag{
    display:block;
    margin-top:10px;
    color:var(--text-dim);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }

  .player-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
    max-height:320px;
    overflow-y:auto;
  }
  .player-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card-alt);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 16px;
  }
  .player-item .p-name{
    font-weight:600;
    font-size:15px;
  }
  .player-item.you .p-name::after{
    content:" (You)";
    color:var(--text-dim);
    font-weight:500;
    font-size:12px;
  }
  .host-badge{
    background:var(--accent);
    color:#fff;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    padding:4px 9px;
    border-radius:6px;
    text-transform:uppercase;
  }

  .waiting-msg{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:16px 0;
  }
  .pulse-dot{
    display:inline-block;
    width:8px;height:8px;
    background:var(--secondary);
    border-radius:50%;
    margin-right:8px;
    animation:pulse 1.4s infinite ease-in-out;
    vertical-align:middle;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.3; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.1); }
  }

  /* Countdown */
  .countdown-screen{
    text-align:center;
  }
  .countdown-number{
    font-size:140px;
    font-weight:900;
    color:var(--accent);
    text-shadow:0 0 60px rgba(255,0,85,0.5);
    animation:countPop 1s ease;
    line-height:1;
  }
  @keyframes countPop{
    0%{ transform:scale(0.4); opacity:0; }
    30%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  .countdown-label{
    margin-top:16px;
    color:var(--text-dim);
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  /* Game / Card flip */
  .game-screen{ text-align:center; }
  .flip-wrap{
    perspective:1200px;
    margin:20px auto 28px;
    width:100%;
    max-width:340px;
    height:280px;
  }
  .flip-card{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 0.7s cubic-bezier(0.4,0.2,0.2,1);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:24px;
    border:1px solid var(--border);
  }
  .flip-front{
    background:var(--card);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .flip-front .qmark{
    font-size:70px;
    font-weight:900;
    color:var(--border);
  }
  .flip-front .tap-hint{
    margin-top:14px;
    color:var(--text-dim);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .flip-back{
    transform:rotateY(180deg);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .flip-back.role-crew{
    background:linear-gradient(160deg, var(--secondary), #004e9e);
  }
  .flip-back.role-impostor{
    background:linear-gradient(160deg, var(--accent), #9e0038);
  }
  .flip-back .role-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.75);
    margin-bottom:10px;
  }
  .flip-back .role-value{
    font-size:30px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#fff;
    text-align:center;
  }

  .reveal-btn{
    max-width:260px;
    margin:0 auto;
  }

  .game-footer-msg{
    margin-top:20px;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  @media (max-width:420px){
    .countdown-number{ font-size:100px; }
    .flip-wrap{ height:250px; }
    .brand h1{ font-size:30px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- MAIN MENU -->
  <div class="screen active" id="screen-menu">
    <div class="brand">
      <h1>IMPO<span>STOR</span></h1>
      <p>Find the impostor among you</p>
    </div>
    <div class="card">
      <div class="error-msg" id="menu-error"></div>
      <div class="stack">
        <button class="btn btn-primary" id="btn-goto-create">Create Room</button>
        <button class="btn btn-secondary" id="btn-goto-join">Join Room</button>
      </div>
    </div>
  </div>

  <!-- CREATE ROOM -->
  <div class="screen" id="screen-create">
    <div class="brand">
      <h1>Create <span>Room</span></h1>
    </div>
    <div class="card">
      <div class="error-msg" id="create-error"></div>
      <div class="field">
        <label>Room Name</label>
        <input type="text" id="create-room-name" placeholder="e.g. MafiaClub" maxlength="24" />
      </div>
      <div class="field">
        <label>Room PIN</label>
        <input type="text" id="create-room-pin" placeholder="e.g. 1234" maxlength="6" inputmode="numeric" />
      </div>
      <div class="field">
        <label>Your Nickname</label>
        <input type="text" id="create-nickname" placeholder="e.g. Alex" maxlength="16" />
      </div>
      <div class="field">
        <label>Word Category</label>
        <select id="create-category">
          <option value="food">Food & Drinks</option>
          <option value="cities">Global Cities</option>
          <option value="objects">Everyday Objects</option>
          <option value="movies">Movies & Shows</option>
        </select>
      </div>
      <div class="stack row-gap">
        <button class="btn btn-primary" id="btn-create-submit">Create Room</button>
        <button class="link-btn" id="btn-create-back">Back</button>
      </div>
    </div>
  </div>

  <!-- JOIN ROOM -->
  <div class="screen" id="screen-join">
    <div class="brand">
      <h1>Join <span>Room</span></h1>
    </div>
    <div class="card">
      <div class="error-msg" id="join-error"></div>
      <div class="field">
        <label>Room Name</label>
        <input type="text" id="join-room-name" placeholder="e.g. MafiaClub" maxlength="24" />
      </div>
      <div class="field">
        <label>Room PIN</label>
        <input type="text" id="join-room-pin" placeholder="e.g. 1234" maxlength="6" inputmode="numeric" />
      </div>
      <div class="field">
        <label>Your Nickname</label>
        <input type="text" id="join-nickname" placeholder="e.g. Sam" maxlength="16" />
      </div>
      <div class="stack row-gap">
        <button class="btn btn-secondary" id="btn-join-submit">Join Room</button>
        <button class="link-btn" id="btn-join-back">Back</button>
      </div>
    </div>
  </div>

  <!-- LOBBY -->
  <div class="screen" id="screen-lobby">
    <div class="card">
      <div class="lobby-header">
        <div class="room-name" id="lobby-room-name">ROOM NAME</div>
        <div class="room-pin" id="lobby-room-pin">0000</div>
        <span class="category-tag" id="lobby-category">CATEGORY</span>
      </div>
      <div class="player-list" id="lobby-player-list"></div>
      <div id="lobby-host-controls" style="display:none;">
        <button class="btn btn-primary" id="btn-start-game">Start Game</button>
      </div>
      <div id="lobby-waiting" class="waiting-msg" style="display:none;">
        <span class="pulse-dot"></span>Waiting for host to start...
      </div>
      <button class="link-btn" id="btn-leave-room" style="margin-top:14px;">Leave Room</button>
    </div>
  </div>

  <!-- COUNTDOWN -->
  <div class="screen" id="screen-countdown">
    <div class="countdown-screen">
      <div class="countdown-number" id="countdown-number">3</div>
      <div class="countdown-label">Game starting</div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="card game-screen">
      <h2 class="title" id="game-round-title">ROUND IN PROGRESS</h2>
      <div class="flip-wrap">
        <div class="flip-card" id="flip-card">
          <div class="flip-face flip-front">
            <div class="qmark">?</div>
            <div class="tap-hint">Tap to reveal</div>
          </div>
          <div class="flip-face flip-back" id="flip-back">
            <div class="role-label" id="role-label">ROLE</div>
            <div class="role-value" id="role-value">VALUE</div>
          </div>
        </div>
      </div>
      <button class="btn btn-secondary reveal-btn" id="btn-reveal">Show My Word</button>
      <div id="game-host-controls" style="display:none; margin-top:20px;">
        <button class="btn btn-primary" id="btn-next-round">Next Round</button>
      </div>
      <div id="game-waiting" class="game-footer-msg" style="display:none;">
        <span class="pulse-dot"></span>Waiting for host to start next round...
      </div>
    </div>
  </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   FIREBASE CONFIGURATION
   Replace with your own project credentials if needed.
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "impostor-game-default-rtdb.firebaseapp.com",
  databaseURL: "https://impostor-game-default-rtdb.firebaseio.com",
  projectId: "impostor-game-default-rtdb",
  storageBucket: "impostor-game-default-rtdb.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:0000000000000000000000"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   WORD CATEGORIES
   ============================================================ */
const CATEGORIES = {
  food: {
    label: "Food & Drinks",
    words: ["Pizza","Sushi","Burger","Pasta","Ice Cream","Coffee","Tacos","Pancakes","Chocolate","Salad","Steak","Ramen","Croissant","Smoothie","Popcorn"]
  },
  cities: {
    label: "Global Cities",
    words: ["Paris","Tokyo","New York","London","Dubai","Rome","Sydney","Cairo","Bangkok","Barcelona","Istanbul","Moscow","Berlin","Toronto","Singapore"]
  },
  objects: {
    label: "Everyday Objects",
    words: ["Umbrella","Backpack","Mirror","Candle","Keyboard","Wallet","Sunglasses","Blanket","Scissors","Lamp","Bicycle","Camera","Headphones","Notebook","Watch"]
  },
  movies: {
    label: "Movies & Shows",
    words: ["Inception","Titanic","Avatar","The Matrix","Jaws","Frozen","Joker","Gladiator","Interstellar","Up","Coco","Shrek","Amelie","Parasite","Dune"]
  }
};

/* ============================================================
   STATE
   ============================================================ */
let currentRoomKey = null;
let currentPlayerId = null;
let currentNickname = null;
let roomRef = null;
let roomListener = null;
let lastRoundKey = null; // used to detect a new round and reset the flip card
let countdownTimeouts = [];

/* ============================================================
   UTILITIES
   ============================================================ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showError(elId, msg){
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}
function clearError(elId){
  const el = document.getElementById(elId);
  el.textContent = '';
  el.classList.remove('show');
}

function normalizeRoomKey(roomName, pin){
  const cleanName = roomName.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const cleanPin = pin.trim().replace(/[^0-9a-zA-Z]/g,'');
  return cleanName + '_' + cleanPin;
}

function generatePlayerId(){
  return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

function saveSession(){
  localStorage.setItem('impostor_session', JSON.stringify({
    roomKey: currentRoomKey,
    playerId: currentPlayerId,
    nickname: currentNickname
  }));
}
function clearSession(){
  localStorage.removeItem('impostor_session');
}
function loadSession(){
  try{
    const raw = localStorage.getItem('impostor_session');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}

function clearCountdownTimers(){
  countdownTimeouts.forEach(t => clearTimeout(t));
  countdownTimeouts = [];
}

/* ============================================================
   NAVIGATION HANDLERS
   ============================================================ */
document.getElementById('btn-goto-create').addEventListener('click', () => {
  clearError('menu-error');
  showScreen('screen-create');
});
document.getElementById('btn-goto-join').addEventListener('click', () => {
  clearError('menu-error');
  showScreen('screen-join');
});
document.getElementById('btn-create-back').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btn-join-back').addEventListener('click', () => showScreen('screen-menu'));

/* ============================================================
   CREATE ROOM
   ============================================================ */
document.getElementById('btn-create-submit').addEventListener('click', async () => {
  clearError('create-error');
  const roomName = document.getElementById('create-room-name').value.trim();
  const roomPin = document.getElementById('create-room-pin').value.trim();
  const nickname = document.getElementById('create-nickname').value.trim();
  const category = document.getElementById('create-category').value;

  if(!roomName || !roomPin || !nickname){
    showError('create-error', 'Please fill in all fields.');
    return;
  }

  const roomKey = normalizeRoomKey(roomName, roomPin);
  if(!roomKey || roomKey === '_'){
    showError('create-error', 'Invalid room name or PIN.');
    return;
  }

  const btn = document.getElementById('btn-create-submit');
  btn.disabled = true;
  btn.textContent = 'Creating...';

  try{
    const snap = await db.ref('rooms/' + roomKey).once('value');
    if(snap.exists()){
      showError('create-error', 'A room with this name and PIN already exists.');
      btn.disabled = false;
      btn.textContent = 'Create Room';
      return;
    }

    const playerId = generatePlayerId();
    const roomData = {
      name: roomName,
      pin: roomPin,
      category: category,
      hostId: playerId,
      state: 'lobby',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      players: {
        [playerId]: {
          nickname: nickname,
          joinedAt: firebase.database.ServerValue.TIMESTAMP
        }
      }
    };

    await db.ref('rooms/' + roomKey).set(roomData);

    currentRoomKey = roomKey;
    currentPlayerId = playerId;
    currentNickname = nickname;
    saveSession();

    db.ref('rooms/' + roomKey + '/players/' + playerId).onDisconnect().remove();

    attachRoomListener();
  }catch(err){
    showError('create-error', 'Could not create room. Check your connection.');
    btn.disabled = false;
    btn.textContent = 'Create Room';
  }
});

/* ============================================================
   JOIN ROOM
   ============================================================ */
document.getElementById('btn-join-submit').addEventListener('click', async () => {
  clearError('join-error');
  const roomName = document.getElementById('join-room-name').value.trim();
  const roomPin = document.getElementById('join-room-pin').value.trim();
  const nickname = document.getElementById('join-nickname').value.trim();

  if(!roomName || !roomPin || !nickname){
    showError('join-error', 'Please fill in all fields.');
    return;
  }

  const roomKey = normalizeRoomKey(roomName, roomPin);
  const btn = document.getElementById('btn-join-submit');
  btn.disabled = true;
  btn.textContent = 'Joining...';

  try{
    const snap = await db.ref('rooms/' + roomKey).once('value');
    if(!snap.exists()){
      showError('join-error', 'Room not found. Check the name and PIN.');
      btn.disabled = false;
      btn.textContent = 'Join Room';
      return;
    }

    const roomData = snap.val();
    if(roomData.state !== 'lobby'){
      showError('join-error', 'This room already has a game in progress.');
      btn.disabled = false;
      btn.textContent = 'Join Room';
      return;
    }

    const existingPlayers = roomData.players || {};
    const nicknameTaken = Object.values(existingPlayers).some(p => p.nickname.toLowerCase() === nickname.toLowerCase());
    if(nicknameTaken){
      showError('join-error', 'That nickname is already taken in this room.');
      btn.disabled = false;
      btn.textContent = 'Join Room';
      return;
    }

    const playerId = generatePlayerId();
    await db.ref('rooms/' + roomKey + '/players/' + playerId).set({
      nickname: nickname,
      joinedAt: firebase.database.ServerValue.TIMESTAMP
    });

    currentRoomKey = roomKey;
    currentPlayerId = playerId;
    currentNickname = nickname;
    saveSession();

    db.ref('rooms/' + roomKey + '/players/' + playerId).onDisconnect().remove();

    attachRoomListener();
  }catch(err){
    showError('join-error', 'Could not join room. Check your connection.');
    btn.disabled = false;
    btn.textContent = 'Join Room';
  }
});

/* ============================================================
   ROOM LISTENER — drives all screen transitions
   ============================================================ */
function attachRoomListener(){
  if(roomRef && roomListener){
    roomRef.off('value', roomListener);
  }
  roomRef = db.ref('rooms/' + currentRoomKey);

  roomListener = roomRef.on('value', (snap) => {
    if(!snap.exists()){
      // room was deleted / ended
      handleRoomGone();
      return;
    }
    const room = snap.val();
    renderRoomState(room);
  });
}

function handleRoomGone(){
  clearSession();
  currentRoomKey = null;
  currentPlayerId = null;
  currentNickname = null;
  showError('menu-error', 'Room no longer exists.');
  showScreen('screen-menu');
}

function renderRoomState(room){
  const players = room.players || {};
  const isHost = room.hostId === currentPlayerId;
  const isStillInRoom = !!players[currentPlayerId];

  if(!isStillInRoom){
    // We were removed from the room
    handleRoomGone();
    return;
  }

  if(room.state === 'lobby'){
    renderLobby(room, players, isHost);
    showScreen('screen-lobby');
  } else if(room.state === 'countdown'){
    showScreen('screen-countdown');
    runCountdown(room, isHost);
  } else if(room.state === 'ingame'){
    renderGame(room, isHost);
    showScreen('screen-game');
  }
}

function renderLobby(room, players, isHost){
  document.getElementById('lobby-room-name').textContent = room.name;
  document.getElementById('lobby-room-pin').textContent = room.pin;
  document.getElementById('lobby-category').textContent = CATEGORIES[room.category] ? CATEGORIES[room.category].label : '';

  const listEl = document.getElementById('lobby-player-list');
  listEl.innerHTML = '';

  const playerEntries = Object.entries(players).sort((a,b) => (a[1].joinedAt||0) - (b[1].joinedAt||0));

  playerEntries.forEach(([pid, pdata]) => {
    const item = document.createElement('div');
    item.className = 'player-item' + (pid === currentPlayerId ? ' you' : '');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'p-name';
    nameSpan.textContent = pdata.nickname;
    item.appendChild(nameSpan);
    if(pid === room.hostId){
      const badge = document.createElement('span');
      badge.className = 'host-badge';
      badge.textContent = 'HOST';
      item.appendChild(badge);
    }
    listEl.appendChild(item);
  });

  const hostControls = document.getElementById('lobby-host-controls');
  const waitingMsg = document.getElementById('lobby-waiting');
  if(isHost){
    hostControls.style.display = 'block';
    waitingMsg.style.display = 'none';
  } else {
    hostControls.style.display = 'none';
    waitingMsg.style.display = 'block';
  }
}

/* ============================================================
   START GAME (HOST ONLY)
   ============================================================ */
document.getElementById('btn-start-game').addEventListener('click', async () => {
  const btn = document.getElementById('btn-start-game');
  btn.disabled = true;

  try{
    const snap = await roomRef.once('value');
    const room = snap.val();
    const players = room.players || {};
    const playerIds = Object.keys(players);

    if(playerIds.length < 2){
      alert('You need at least 2 players to start.');
      btn.disabled = false;
      return;
    }

    const impostorId = playerIds[Math.floor(Math.random() * playerIds.length)];
    const categoryWords = CATEGORIES[room.category] ? CATEGORIES[room.category].words : CATEGORIES.food.words;
    const word = categoryWords[Math.floor(Math.random() * categoryWords.length)];
    const roundId = 'r_' + Date.now();

    await roomRef.update({
      state: 'countdown',
      impostorId: impostorId,
      word: word,
      roundId: roundId,
      countdownAt: firebase.database.ServerValue.TIMESTAMP
    });
  }catch(err){
    alert('Failed to start game. Please try again.');
  } finally {
    btn.disabled = false;
  }
});

/* ============================================================
   COUNTDOWN
   ============================================================ */
let countdownRunningFor = null;

function runCountdown(room, isHost){
  // Avoid re-triggering the same countdown sequence repeatedly on redundant snapshots
  const key = room.roundId + '_countdown';
  if(countdownRunningFor === key) return;
  countdownRunningFor = key;
  clearCountdownTimers();

  const numberEl = document.getElementById('countdown-number');
  const sequence = ['3','2','1','GO'];
  let i = 0;

  function step(){
    if(i >= sequence.length){
      return;
    }
    numberEl.textContent = sequence[i];
    numberEl.style.animation = 'none';
    void numberEl.offsetWidth;
    numberEl.style.animation = 'countPop 1s ease';
    i++;
    if(i < sequence.length){
      countdownTimeouts.push(setTimeout(step, 800));
    }
  }
  step();

  if(isHost){
    const totalDuration = sequence.length * 800 + 200;
    countdownTimeouts.push(setTimeout(async () => {
      try{
        const snap = await roomRef.once('value');
        const currentRoom = snap.val();
        if(currentRoom && currentRoom.state === 'countdown' && currentRoom.roundId === room.roundId){
          await roomRef.update({ state: 'ingame' });
        }
      }catch(e){ /* silent */ }
    }, totalDuration));
  }
}

/* ============================================================
   GAME SCREEN
   ============================================================ */
function renderGame(room, isHost){
  // Reset the flip card whenever a new round starts
  if(lastRoundKey !== room.roundId){
    lastRoundKey = room.roundId;
    countdownRunningFor = null;
    const flipCard = document.getElementById('flip-card');
    flipCard.classList.remove('flipped');
    document.getElementById('btn-reveal').disabled = false;
    document.getElementById('btn-reveal').textContent = 'Show My Word';
  }

  const isImpostor = room.impostorId === currentPlayerId;
  const roleLabelEl = document.getElementById('role-label');
  const roleValueEl = document.getElementById('role-value');
  const flipBack = document.getElementById('flip-back');

  flipBack.classList.remove('role-crew', 'role-impostor');
  if(isImpostor){
    flipBack.classList.add('role-impostor');
    roleLabelEl.textContent = 'Warning';
    roleValueEl.textContent = 'YOU ARE THE IMPOSTOR!';
  } else {
    flipBack.classList.add('role-crew');
    roleLabelEl.textContent = 'Secret Word';
    roleValueEl.textContent = room.word;
  }

  const hostControls = document.getElementById('game-host-controls');
  const waitingMsg = document.getElementById('game-waiting');
  if(isHost){
    hostControls.style.display = 'block';
    waitingMsg.style.display = 'none';
  } else {
    hostControls.style.display = 'none';
    waitingMsg.style.display = 'block';
  }
}

document.getElementById('btn-reveal').addEventListener('click', () => {
  const flipCard = document.getElementById('flip-card');
  flipCard.classList.add('flipped');
  const btn = document.getElementById('btn-reveal');
  btn.disabled = true;
  btn.textContent = 'Word Revealed';
});

/* ============================================================
   NEXT ROUND (HOST ONLY)
   ============================================================ */
document.getElementById('btn-next-round').addEventListener('click', async () => {
  try{
    await roomRef.update({
      state: 'lobby',
      impostorId: null,
      word: null
    });
  }catch(err){
    alert('Failed to reset round.');
  }
});

/* ============================================================
   LEAVE ROOM
   ============================================================ */
document.getElementById('btn-leave-room').addEventListener('click', async () => {
  await leaveRoomCleanup();
  showScreen('screen-menu');
});

async function leaveRoomCleanup(){
  clearCountdownTimers();
  if(currentRoomKey && currentPlayerId){
    try{
      const playerRef = db.ref('rooms/' + currentRoomKey + '/players/' + currentPlayerId);
      playerRef.onDisconnect().cancel();
      await playerRef.remove();
    }catch(e){ /* silent */ }
  }
  if(roomRef && roomListener){
    roomRef.off('value', roomListener);
  }
  roomRef = null;
  roomListener = null;
  currentRoomKey = null;
  currentPlayerId = null;
  currentNickname = null;
  lastRoundKey = null;
  countdownRunningFor = null;
  clearSession();
}

/* ============================================================
   AUTO-REJOIN ON LOAD (SESSION PERSISTENCE)
   ============================================================ */
async function tryRejoin(){
  const session = loadSession();
  if(!session || !session.roomKey || !session.playerId) return;

  try{
    const snap = await db.ref('rooms/' + session.roomKey).once('value');
    if(!snap.exists()){
      clearSession();
      return;
    }
    const room = snap.val();
    const players = room.players || {};

    currentRoomKey = session.roomKey;
    currentPlayerId = session.playerId;
    currentNickname = session.nickname;

    if(!players[session.playerId]){
      // Player was removed (e.g. disconnect) — re-add them to restore session
      await db.ref('rooms/' + session.roomKey + '/players/' + session.playerId).set({
        nickname: session.nickname,
        joinedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    db.ref('rooms/' + session.roomKey + '/players/' + session.playerId).onDisconnect().remove();

    attachRoomListener();
  }catch(e){
    clearSession();
  }
}

tryRejoin();

/* Clean up input formatting */
document.getElementById('create-room-pin').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g,'');
});
document.getElementById('join-room-pin').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g,'');
});
</script>
